# https://taskfile.dev

version: "3"

includes:
  yatlc:
    taskfile: yatlc/yatlc.tasks.yml
    dir: yatlc
  conformance:
    taskfile: conformance/conformance.tasks.yml
    dir: conformance
  tools:
    taskfile: tools/tools.tasks.yml
    dir: tools
  poc:
    taskfile: poc/poc.tasks.yml
    dir: poc

tasks:
  default:
    deps:
      - ci

  ci:
    run: once
    deps:
      - yatlc:ci

  poc:
    run: once
    deps:
      - poc:run
